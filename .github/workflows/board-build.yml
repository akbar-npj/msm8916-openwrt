name: Board Build

# Builds only the boards a pull request actually touches, so "it builds on my
# machine" stops being the only evidence.  Opt-in per pull request with the
# `board-build` label: one board is ~40 minutes, and most pull requests do not
# need it.  Nothing is published and no secret is used - a pull request from a
# fork gets a throwaway signing key.  The images are kept as a 7-day run
# artifact for flashing and testing, not as a release: the apk feed inside them
# is signed with that throwaway key, so `apk add` from the published feed fails.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'diffconfigs/**'
      - 'msm89xx/**'
      - 'packages/**'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      device:
        description: 'Board to build (empty = every diffconfigs/ entry)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: board-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  pick:
    name: Pick boards
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'board-build')
    outputs:
      devices: ${{ steps.pick.outputs.devices }}
      reason: ${{ steps.pick.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Work out which boards this pull request touches
        id: pick
        env:
          DEVICE: ${{ inputs.device }}
          BASE: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$DEVICE" ]; then
            LIST="\"$DEVICE\""
            REASON="dispatch: $DEVICE"
          elif [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            changed=$(git diff --name-only "origin/$BASE...HEAD" -- diffconfigs |
                      sed 's|diffconfigs/||' | sort -u)
            if [ -n "$changed" ]; then
              LIST=$(printf '%s\n' "$changed" | sed 's/.*/"&"/' | paste -sd, -)
              REASON="diffconfigs touched: $(printf '%s' "$changed" | tr '\n' ' ')"
            else
              # A patch or package change usually targets one board, but we
              # cannot tell which: build one known-good board to prove the tree
              # still compiles, and say so.
              LIST='"hmuf02v5"'
              REASON="no diffconfigs change - sentinel build of hmuf02v5"
            fi
          else
            LIST=$(ls diffconfigs | sed 's/.*/"&"/' | paste -sd, -)
            REASON="every diffconfigs/ entry"
          fi
          echo "devices=[$LIST]" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "::notice::Boards [$LIST] - $REASON"

  build:
    name: Build ${{ matrix.device }}
    needs: pick
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.pick.outputs.devices) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Cache OpenWrt downloads & toolchain
        uses: actions/cache@v5
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
            openwrt/staging_dir/host
          key: openwrt-pr-cache-${{ hashFiles('version', 'diffconfigs/hmuf02v5') }}
          restore-keys: |
            openwrt-pr-cache-

      - name: Prepare OpenWrt tree
        run: ./build.sh prepare

      - name: Build ${{ matrix.device }}
        run: ./build.sh build "${{ matrix.device }}"

      # Which commit the image came from: the pull request head, or the branch
      # on a dispatch.  Sliced here because expressions cannot take a substring.
      - name: Resolve artifact suffix
        id: artifact
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      # Success only: a red build has nothing worth downloading, and uploading
      # partial output just fills the storage quota.
      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: board-build_${{ matrix.device }}_${{ steps.artifact.outputs.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-squashfs-gpt_both0.bin
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-squashfs-boot.img
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-squashfs-system.img
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-squashfs-sysupgrade.bin
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*.manifest
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-flash.sh
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-*-firmware.zip

      - name: Report
        if: always()
        run: |
          echo "Board ${{ matrix.device }}: ${{ job.status }} (${{ needs.pick.outputs.reason }})"
