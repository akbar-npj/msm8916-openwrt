name: Publish Single Package

# Hotfix path for ONE package: rebuild it against the same toolchain and kernel
# as the released firmware, splice the new .apk into the ALREADY PUBLISHED feed
# and re-sign the index. Devices then pick it up with a plain
#
#     apk update && apk upgrade <package>
#
# instead of a ~40 MB firmware reflash.
#
# Exception: a package the image build version-pins in /etc/apk/world --
# base-files, kernel and libc -- ignores "apk upgrade": the pin wins, apk
# reports OK and changes nothing.  Those need
#
#     apk update && apk add '<package>=<version>'
#
# which installs the new build and moves the pin with it.  Measured
# 2026-11-02 on base-files 1718 -> 1719: "apk upgrade base-files" printed
# "OK: 83.1 MiB in 307 packages" and changed nothing; the explicit add
# worked.  A plain "apk add <package>" is still a no-op - the version is
# what makes it an upgrade.
#
# Why the published feed is downloaded first: `make package/index` indexes
# whatever .apk files sit in openwrt/bin/packages. A single-package build fills
# exactly one directory, so re-indexing without the published tree would publish
# an index that lists one package and silently drops every other one from
# `apk search` / `apk add`.
#
# The feed URL never changes (releases/<base>/...), so no device needs a new
# repository line and no key needs re-trusting.
#
# Dispatch example:
#   gh workflow run publish-package.yml --ref main \
#     -f package=msm89xx-scripts -f bump=true

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to rebuild (directory name under packages/). Empty = feed maintenance only: no build, just prune and re-index."
        required: false
        default: ""
        type: string
      base:
        description: "Feed base to publish into (releases/<base>). Empty = derive from ./version"
        required: false
        default: ""
        type: string
      board:
        description: "Board config to build with (only matters for kmod packages)"
        required: false
        default: "hmuf02v5"
        type: string
      bump:
        description: "Increment PKG_RELEASE first (otherwise devices keep the same version and see no update)"
        required: false
        default: true
        type: boolean
      delete:
        description: "Space-separated .apk filenames to remove from the feed (e.g. a superseded build). The index is regenerated without them."
        required: false
        default: ""
        type: string
      target_package:
        description: "Build a TARGET package (e.g. base-files) instead of one under packages/. Its .apk lands in bin/targets/<target>/packages and is spliced into the targets feed."
        required: false
        default: false
        type: boolean
      pkg_release:
        description: "Explicit PKG_RELEASE for a target package (base-files takes max(COMMITCOUNT, BASE_FILES_RELEASE_FLOOR), so it cannot be auto-incremented). Required with target_package; must be above the published high-water mark."
        required: false
        default: ""
        type: string
      scope:
        description: "Where to publish. revision = releases/<exact version> only (required for pinned packages). all = also the shared releases/<base> feed."
        required: false
        default: revision
        type: choice
        options:
          - revision
          - all
      hotfix_title:
        description: "One-line description written to hotfix.json for this build. Empty = publish the package without a manifest entry."
        required: false
        default: ""
        type: string
      hotfix_restart:
        description: "Space-separated init scripts to restart after the fix is installed (e.g. sim-hotplug)."
        required: false
        default: ""
        type: string
      skip_kernel:
        description: "Skip the kernel tree build. Only for packages whose compile chain reaches no kmod: it turns a ~35 min publish into ~5 min. Leave it false for kmod-*, target packages, board packages and the LuCI apps that depend on them -- it overrides the detection below."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build and stage everything, then print what would be published to gh-pages without committing or pushing. Use this to exercise a publish (and the high-water mark) safely."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Two hotfixes must not race on the gh-pages branch.
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ inputs.package || 'Feed maintenance' }}
    runs-on: ubuntu-24.04

    env:
      PKG: ${{ inputs.package }}
      BOARD: ${{ inputs.board }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Resolve feed base and package
        id: vars
        run: |
          set -euo pipefail
          BASE="${{ inputs.base }}"
          if [ -z "$BASE" ]; then
            BASE="$(sed 's/-r[0-9]*$//' version)"
          fi
          echo "base=${BASE}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.target_package }}" = "true" ] && [ -z "${{ inputs.pkg_release }}" ]; then
            echo "::error::target_package=true needs pkg_release (e.g. 1722, above the floor in openwrt-patches/812-*.patch): base-files derives PKG_RELEASE from COMMITCOUNT, so it cannot be bumped automatically."
            exit 1
          fi
          if [ "${{ inputs.scope }}" = "all" ]; then
            case "$PKG" in
              base-files|kernel|libc)
                echo "::error::${PKG} is version-pinned in /etc/apk/world. Publish it with scope=revision: in the shared feed the LuCI Software page would offer a fix apk then refuses to install."
                exit 1
                ;;
            esac
          fi
          if [ -n "$PKG" ] && [ "${{ inputs.target_package }}" != "true" ] && [ ! -f "packages/${PKG}/Makefile" ]; then
            echo "::error::packages/${PKG}/Makefile does not exist."
            echo "Known packages:"
            ls packages/
            exit 1
          fi
          echo "Feed base: ${BASE}"
          echo "Package : ${PKG} (board ${BOARD})"

      - name: Bump PKG_RELEASE
        if: inputs.bump && inputs.package != '' && !inputs.target_package
        run: |
          set -euo pipefail
          MK="packages/${PKG}/Makefile"
          OLD="$(sed -n 's/^PKG_RELEASE:=\([0-9]*\)$/\1/p' "$MK" | head -1)"
          if [ -z "$OLD" ]; then
            echo "::error::No numeric PKG_RELEASE:=<n> line in ${MK}; bump it by hand."
            exit 1
          fi
          NEW=$((OLD + 1))
          awk -v old="$OLD" -v new="$NEW" '
            !done && $0 ~ /^PKG_RELEASE:=[0-9]+$/ {
              print "PKG_RELEASE:=" new; done = 1; next
            }
            { print }
          ' "$MK" > "$MK.new" && mv "$MK.new" "$MK"
          echo "PKG_RELEASE ${OLD} -> ${NEW}"
          echo "::warning::packages/${PKG}/Makefile was bumped to PKG_RELEASE:=${NEW} in this run only. Commit it, or the next build starts from ${OLD} again."

      - name: Cache OpenWrt Downloads & Toolchain
        uses: actions/cache@v5
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
            openwrt/staging_dir/host
          key: openwrt-cache-${{ steps.vars.outputs.base }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}
          restore-keys: |
            openwrt-cache-${{ steps.vars.outputs.base }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}-
            openwrt-cache-${{ steps.vars.outputs.base }}-
            openwrt-cache-

      - name: Build Docker Builder Image & Prepare OpenWrt Tree
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ./build.sh prepare
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "::error::APK_SIGNING_KEY secret is not set."
            echo "::error::The re-signed index would be signed with a random per-build key"
            echo "::error::and every device would reject it with 'UNTRUSTED signature'."
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_KEY" > openwrt/private-key.pem
          echo "Injected persistent private signing key."

      - name: Stamp the target package release
        if: inputs.target_package && inputs.package != ''
        run: |
          set -euo pipefail
          MK="openwrt/package/${PKG}/Makefile"
          [ -f "$MK" ] || { echo "::error::No ${MK} in the prepared tree."; exit 1; }
          # base-files carries PKG_RELEASE:=$(COMMITCOUNT), and COMMITCOUNT does
          # not move between releases, so a rebuilt base-files would carry the
          # same version and apk would skip it.  Stamp an explicit number.
          sed -i "s|^PKG_RELEASE:=.*|PKG_RELEASE:=${{ inputs.pkg_release }}|" "$MK"
          grep -n '^PKG_RELEASE:=' "$MK"

      - name: Fetch the published feed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${{ steps.vars.outputs.base }}"
          FULL="$(cat version)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/gh-pages \
            || { echo "::error::Cannot clone the gh-pages branch."; exit 1; }
          # A revision-scoped publish writes to releases/${FULL} only, and that
          # directory is where every earlier hotfix for THIS build already lives.
          # Restoring the shared base feed (releases/${BASE}) instead drops all
          # of them: the re-index regenerates the index from the restored tree,
          # so a package published two hotfixes ago (e.g. msm89xx-scripts r11)
          # falls out of the index even though its .apk file is still on disk,
          # and devices can no longer `apk add` it (measured 2026-11-06: two
          # sequential revision publishes left msm89xx-scripts and
          # msm89xx-firmware-upgrade one revision behind their manifests).
          # Restore the directory we are about to overwrite, so prior hotfixes
          # carry through.  scope=all still restores the base feed.
          if [ "${{ inputs.scope }}" = "revision" ]; then
            SRC_BASE="${FULL}"
          else
            SRC_BASE="${BASE}"
          fi
          SRC="/tmp/gh-pages/releases/${SRC_BASE}"
          if [ ! -d "$SRC/packages/aarch64_generic" ]; then
            echo "::error::No published feed at releases/${SRC_BASE} on gh-pages."
            echo "::error::Publish a full release for this base first, or pass the right 'base'."
            exit 1
          fi
          mkdir -p openwrt/bin/packages openwrt/bin/targets/msm89xx/msm8916/packages
          cp -a "$SRC/packages/aarch64_generic/." openwrt/bin/packages/aarch64_generic/
          if [ -d "$SRC/targets/msm89xx/msm8916/packages" ]; then
            cp -a "$SRC/targets/msm89xx/msm8916/packages/." openwrt/bin/targets/msm89xx/msm8916/packages/
          fi
          echo "Restored feed from releases/${SRC_BASE}:"
          for d in openwrt/bin/packages/aarch64_generic/*/; do
            printf '  %-60s %s apks\n' "$d" "$(find "$d" -maxdepth 1 -name '*.apk' | wc -l)"
          done | tee /tmp/feed-before.txt
          find openwrt/bin/packages/aarch64_generic -maxdepth 2 -name '*.apk' -printf '%f\n' \
            | sort > /tmp/feed-before-files.txt

      - name: Delete obsolete packages from the feed
        if: inputs.delete != ''
        env:
          DELETE_LIST: ${{ inputs.delete }}
        run: |
          set -euo pipefail
          BASE="${{ steps.vars.outputs.base }}"
          FULL="$(cat version)"
          : > /tmp/feed-deleted.txt
          # The tree that gets indexed, plus every release directory the
          # publish step writes to (base and full version).  Copying the build
          # output over gh-pages never removes anything, so a file dropped in
          # only one place would come straight back.
          DIRS=""
          for d in openwrt/bin/packages/aarch64_generic/*/; do
            if [ -d "$d" ]; then DIRS="$DIRS $d"; fi
          done
          for DIR in $(printf '%s\n' "$BASE" "$FULL" | sort -u); do
            for d in "/tmp/gh-pages/releases/${DIR}/packages/aarch64_generic/"*/; do
              if [ -d "$d" ]; then DIRS="$DIRS $d"; fi
            done
          done

          for f in $DELETE_LIST; do
            case "$f" in
              *.apk) ;;
              *) echo "::error::Not an .apk filename: $f"; exit 1 ;;
            esac
            found=0
            in_build=0
            for d in $DIRS; do
              if [ -f "$d/$f" ]; then
                rm -f "$d/$f"
                echo "removed ${d}/${f}"
                found=1
                case "$d" in openwrt/bin/*) in_build=1 ;; esac
              fi
            done
            [ "$found" -eq 1 ] || { echo "::error::$f is not in the feed."; exit 1; }
            # Only a deletion from the tree that gets indexed changes the
            # expected package count; a snapshot-only cleanup does not.
            if [ "$in_build" -eq 1 ]; then
              echo "$f" >> /tmp/feed-deleted.txt
            fi
          done

      # The single-package build pulls in the board's selected kmods, and a
      # kmod build needs linux-<ver>/.config in the kernel build dir. On a fresh
      # runner that file does not exist until the kernel is configured, so the
      # kmod compile fails with "No rule to make target .../.config". Prepare
      # (configure + build) the kernel tree first so the .config is present.
      - name: Decide whether the kernel tree is needed
        id: kernel
        if: inputs.package != ''
        run: |
          set -euo pipefail
          # A target package (base-files) and anything declaring a
          # KernelPackage/ compile against the kernel.  A shell/JS/LuCI package
          # does not, and the kernel build is ~85% of a publish (25-42 min of a
          # 30-50 min run), so work it out instead of trusting the caller.
          NEED=0
          if [ "${{ inputs.target_package }}" = "true" ]; then NEED=1; fi
          if [ "$NEED" -eq 0 ]; then
            for d in "packages/${PKG}" "openwrt/package/${PKG}"; do
              if [ -d "$d" ] && grep -rqs 'define KernelPackage/' "$d"; then NEED=1; fi
            done
          fi
          # Board packages under package/msm8916 declare no KernelPackage yet
          # still reach the board's kmods: msm89xx-scripts pulls in
          # linux-firmware and gpio-button-hotplug, and the build dies on
          #   No rule to make target '.../linux-6.12.112/.config'
          # on a runner whose build_dir is cold (measured 2026-11-04, runs
          # 41809560224 and 41811082178).  The board's .config is not written
          # yet at this point, so key off the path.
          if [ "$NEED" -eq 0 ] && [ -d "openwrt/package/msm8916/${PKG}" ]; then NEED=1; fi
          # A LuCI app that depends on a board package inherits that chain:
          # luci-app-led-setup -> msm89xx-scripts -> linux-firmware +
          # gpio-button-hotplug, so it needs linux-<ver>/.config as well.
          # Without this it is classified as "no kmod" and the publish dies
          # with  No rule to make target '.../linux-6.12.112/.config'.
          if [ "$NEED" -eq 0 ] && [ -f "packages/${PKG}/Makefile" ] &&
             grep -qs '+msm89xx-scripts' "packages/${PKG}/Makefile"; then
            NEED=1
          fi
          echo "needed=$NEED" >> "$GITHUB_OUTPUT"
          echo "kernel tree needed: $NEED"

      - name: Prepare the kernel tree
        # Needed for target packages too: base-files pulls kmods into its
        # compile chain (gpio-button-hotplug), and a kmod build dies without
        # linux-<ver>/.config -- measured in run 41350406799.
        if: ${{ steps.kernel.outputs.needed == '1' && !inputs.skip_kernel }}
        run: ./build.sh kernel "$BOARD"

      - name: Build the package
        if: inputs.package != ''
        run: ./build.sh package "$PKG" "$BOARD"

      - name: Re-index and re-sign the feed
        run: |
          # In feed-maintenance mode nothing has run "make defconfig" yet, and
          # "make package/index" falls through to menuconfig and dies on a
          # terminal.  Mirror build.sh's prepare_config.  A login shell, like
          # build.sh's docker_exec uses: the OpenWrt tree expects the
          # environment bash -lc sets up.
          if [ ! -f openwrt/.config ]; then
            docker compose -f devenv/docker-compose.yml exec -T builder bash -lc "
              umask 022
              cd /repo/openwrt
              cp /repo/diffconfigs/${BOARD} .config
              make defconfig V=sc
            "
          fi
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc "
            umask 022
            cd /repo/openwrt
            make package/index V=s
          "

      # make package/index only walks bin/packages/<arch>/<feed>.  A target
      # package (base-files) lives in bin/targets/<target>/packages, so its
      # index is rebuilt here the same way publish-kmod.yml does it.
      - name: Re-index and re-sign the targets feed
        if: inputs.target_package
        run: |
          set -euo pipefail
          docker compose -f devenv/docker-compose.yml exec -T builder bash -lc "
            umask 022
            cd /repo/openwrt/bin/targets/msm89xx/msm8916/packages
            ls *.apk >/dev/null
            /repo/openwrt/staging_dir/host/bin/apk mkndx \
              --root /repo/openwrt \
              --keys-dir /repo/openwrt \
              --allow-untrusted \
              --sign /repo/openwrt/private-key.pem \
              --output packages.adb *.apk
            /repo/openwrt/staging_dir/host/bin/apk adbdump --format json packages.adb | \
              /repo/openwrt/scripts/make-index-json.py -f apk -a aarch64_generic - > index.json
          "
          echo "Re-indexed $(ls openwrt/bin/targets/msm89xx/msm8916/packages/*.apk | wc -l) target packages"

      - name: Verify nothing fell out of the feed
        run: |
          set -euo pipefail
          # Compare package NAMES, not .apk file counts.
          #
          # A rebuild prunes every superseded version of whatever it compiles
          # (scripts/ipkg-remove), and a single-package build ALSO rebuilds that
          # package's dependencies when the tree is newer than the published
          # feed.  Counting files then reports a "shrink" that never happened --
          # measured 2026-10-31: publishing luci-app-firmware-upgrade also
          # rebuilt msm89xx-firmware-upgrade r9 -> r10 and pruned r8 + r9, so the
          # feed went 225 -> 225 files while the old check computed 225 -> 224
          # and refused to publish a perfectly good feed.
          #
          # find | wc -l, not "ls | grep -c": grep exits 1 on a count of zero,
          # and the build creates empty sections (telephony, video) that the
          # published feed never had, so set -e killed the job on a healthy feed.
          # Two version shapes: a normal package is name-1.2.3-r4.apk, but a
          # target package (base-files) is name-1719~981c978eff.apk -- no -r
          # suffix, so the first pattern alone leaves the version in the name
          # and the rebuilt package looks like a different package.
          pkgname() {
            sed -E 's/-[0-9][^-]*-r[0-9]+\.apk$//; s/-[0-9][^-]*~[^-]*\.apk$//'
          }
          echo "After re-index:"
          for d in openwrt/bin/packages/aarch64_generic/*/; do
            printf '  %-60s %s apks\n' "$d" "$(find "$d" -maxdepth 1 -name '*.apk' | wc -l)"
          done

          # /tmp/feed-before-files.txt holds the restored feed's basenames.
          pkgname < /tmp/feed-before-files.txt | sort -u > /tmp/feed-before-names.txt
          # A target package lands in bin/targets/.../packages, not in the
          # feed tree, so both directories have to be listed here or the
          # "produced a file" check below fails for it.
          find openwrt/bin/packages/aarch64_generic openwrt/bin/targets/msm89xx/msm8916/packages \
            -name '*.apk' -printf '%f\n' \
            | pkgname | sort -u > /tmp/feed-after-names.txt
          : > /tmp/feed-deleted-names.txt
          if [ -s /tmp/feed-deleted.txt ]; then
            pkgname < /tmp/feed-deleted.txt | sort -u > /tmp/feed-deleted-names.txt
          fi

          # The rebuilt package must actually have produced a file.
          if [ -n "$PKG" ] && ! grep -qx -- "$PKG" /tmp/feed-after-names.txt; then
            echo "::error::The build produced no $PKG .apk - refusing to publish."
            exit 1
          fi

          # A package must never disappear because of a hotfix.  Deliberate
          # deletions are allowed to, so they are subtracted first.
          lost="$(comm -23 /tmp/feed-before-names.txt /tmp/feed-after-names.txt \
                  | comm -23 - /tmp/feed-deleted-names.txt || true)"
          if [ -n "$lost" ]; then
            echo "::error::These packages fell out of the feed - refusing to publish:"
            printf '  %s\n' $lost
            exit 1
          fi
          echo "OK: $(wc -l < /tmp/feed-before-names.txt) -> $(wc -l < /tmp/feed-after-names.txt) package names, none lost"
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          BASE="${{ steps.vars.outputs.base }}"
          FULL="$(cat version)"
          # A pinned package stays revision-scoped: a device may only ever be
          # offered a fix built for its own image.
          if [ "${{ inputs.scope }}" = "revision" ]; then
            DIRS="$FULL"
          else
            DIRS="$(printf '%s\n' "$BASE" "$FULL" | sort -u)"
          fi
          for DIR in $DIRS; do
            DEST="/tmp/gh-pages/releases/${DIR}"
            [ -d "$DEST/packages/aarch64_generic" ] || continue
            echo "Updating releases/${DIR}"
            cp -a openwrt/bin/packages/aarch64_generic/. "$DEST/packages/aarch64_generic/"
            # Only a target package build produces a targets index of its own.
            # Any other publish merely restored the SHARED feed into that
            # directory, so copying it into releases/<exact version> would
            # overwrite the revision feed's index with the base one and make a
            # target hotfix published there earlier vanish from the index
            # (measured 2026-11-02: a luci-app publish wiped base-files 1720
            # out of releases/25.12.6-r4 while leaving the .apk behind).
            if [ "${{ inputs.target_package }}" = "true" ] && [ -d "$DEST/targets/msm89xx/msm8916/packages" ]; then
              cp -a openwrt/bin/targets/msm89xx/msm8916/packages/. "$DEST/targets/msm89xx/msm8916/packages/"
            fi
            [ -f openwrt/public-key.pem ] && cp -f openwrt/public-key.pem "$DEST/public-key.pem" || true
          done
          # The version this build produced.  The published feed was copied
          # back into these directories, so the previous build of the same
          # package is sitting next to the new one: take the HIGHEST version,
          # never "the first file find returns".  Used by hotfix.json and by
          # the high-water mark below.
          VER=""
          if [ -n "$PKG" ]; then
            VER="$(find openwrt/bin/packages openwrt/bin/targets/msm89xx/msm8916/packages \
                     -name "${PKG}-*.apk" -printf '%f\n' 2>/dev/null \
                   | sed -e "s|^${PKG}-||" -e 's|\.apk$||' \
                   | sort -V | tail -1)"
            [ -n "$VER" ] || { echo "::error::cannot work out the built version of ${PKG}"; exit 1; }
          fi

          # hotfix.json for this exact build.  Devices fetch only their own
          # release directory, so the URL is the applies-to tag: a fix
          # published here can never reach a different image.
          if [ -n "${{ inputs.hotfix_title }}" ] && [ -n "$PKG" ]; then
            DEST="/tmp/gh-pages/releases/${FULL}"
            mkdir -p "$DEST"
            ID="$(date -u +%F)-${PKG}"
            ENTRY="$(jq -n --arg id "$ID" --arg pkg "$PKG" --arg ver "$VER" \
              --arg title "${{ inputs.hotfix_title }}" \
              --arg restart "${{ inputs.hotfix_restart }}" --arg date "$(date -u +%F)" \
              '{id: $id, package: $pkg, version: $ver, title: $title,
                restart: ($restart | split(" ") | map(select(length > 0))),
                published: $date}')"
            if [ -f "$DEST/hotfix.json" ]; then
              # Keep exactly ONE entry per package: the build just published is
              # cumulative, so it supersedes every earlier hotfix of the same
              # package.  Matching on id alone is not enough -- each publish gets
              # a fresh "date-package" id, so two fixes for one package (e.g.
              # msm89xx-scripts r9 then r14) would both stay.  A device below
              # both then tried the older one first, and apk refused it: the feed
              # index only carries the newest version, so the exact pin
              # pkg=oldver was unsatisfiable and "Install fixes" failed with
              # "breaks: world[...]".  Merge the older entries' restart services
              # into the new one so their fixes still get activated.
              jq --argjson e "$ENTRY" --arg b "$FULL" \
                '.build = $b
                 | ([.hotfixes[] | select(.package == $e.package) | .restart[]?] | unique) as $prev
                 | .hotfixes = ([.hotfixes[] | select(.package != $e.package)]
                     + [ ($e + {restart: (($e.restart + $prev) | unique)}) ])' \
                "$DEST/hotfix.json" > "$DEST/hotfix.json.new"
            else
              jq -n --argjson e "$ENTRY" --arg b "$FULL" '{build: $b, hotfixes: [$e]}' > "$DEST/hotfix.json.new"
            fi
            mv -f "$DEST/hotfix.json.new" "$DEST/hotfix.json"
            echo "hotfix.json: $ID -> $VER (releases/${FULL})"
          fi

          # High-water mark: the highest version ever published per package on
          # this feed base.  build-and-release.yml refuses to ship an image
          # whose base-files floor is not strictly above it, because apk
          # compares numbers, not contents -- an image at or below the hotfix
          # line can never supersede that hotfix, and re-publishing the same
          # number is a silent no-op on the device.
          #
          # Rebuilt from scratch every run: every hotfix.json already on
          # gh-pages, then the existing file, then this build.  Highest wins,
          # so it self-seeds on the first run and can never go backwards.
          if [ -n "$PKG" ] && [ -n "$VER" ]; then
            HIGH="/tmp/gh-pages/releases/${BASE}/published-versions.json"
            mkdir -p "$(dirname "$HIGH")"
            {
              jq -r '.hotfixes[]? | "\(.package) \(.version)"' /tmp/gh-pages/releases/*/hotfix.json 2>/dev/null || true
              if [ -f "$HIGH" ]; then
                jq -r '(.packages // {}) | to_entries[] | "\(.key) \(.value)"' "$HIGH" 2>/dev/null || true
              fi
              printf '%s %s\n' "$PKG" "$VER"
            } | sort -k1,1 -k2,2V \
              | awk 'NF==2 {m[$1]=$2} END {for (p in m) print p, m[p]}' \
              | jq -Rn --arg d "$(date -u +%F)" \
                  '[inputs | split(" ") | {(.[0]): .[1]}] | add // {} | {updated: $d, packages: .}' \
              > "$HIGH.new"
            mv -f "$HIGH.new" "$HIGH"
            echo "published-versions.json: $(jq -c '.packages' "$HIGH")"
          fi

          [ -f openwrt/public-key.pem ] && cp -f openwrt/public-key.pem /tmp/gh-pages/public-key.pem || true
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::warning::Nothing changed on gh-pages - was PKG_RELEASE bumped?"
            exit 0
          fi
          # Everything above ran for real (build, splice, index, manifests);
          # only the commit and the push are skipped.  Nothing leaves the
          # runner, so this is safe to run against a live feed.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::DRY_RUN - not committing. This is what would be published:"
            git diff --cached --stat
            echo "--- manifest changes:"
            git diff --cached -- '*hotfix.json' '*published-versions.json' || true
            exit 0
          fi
          if [ -n "$PKG" ]; then
            MSG="feed: publish ${PKG} into releases/${BASE} (${FULL})"
          else
            MSG="feed: maintain releases/${BASE} (${FULL})"
          fi
          git commit -m "$MSG"
          git push origin gh-pages

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          BASE="${{ steps.vars.outputs.base }}"
          {
            echo "### Published \`${PKG}\`"
            echo
            echo "Feed: https://akbar-npj.github.io/msm8916-openwrt/releases/${BASE}/packages/aarch64_generic/"
            echo
            echo "Built:"
            find openwrt/bin/packages openwrt/bin/targets/msm89xx/msm8916/packages \
              -name "${PKG}-*.apk" -printf '  %f\n' 2>/dev/null || true
            if [ -s /tmp/feed-deleted.txt ]; then
              echo
              echo "Removed from the feed:"
              sed 's/^/  /' /tmp/feed-deleted.txt
            fi
            echo
            echo "On the device:"
            echo '```'
            echo "apk update"
            echo "apk upgrade ${PKG}"
            echo '```'
            echo
            if [ "${{ inputs.target_package }}" = "true" ]; then
              echo "> Feed: https://akbar-npj.github.io/msm8916-openwrt/releases/${BASE}/targets/msm89xx/msm8916/packages/"
              echo ">"
              echo "> \`PKG_RELEASE\` was stamped to ${{ inputs.pkg_release }} for this build only (from the workflow input, nothing to commit)."
              echo ">"
              echo "> The upgrade replaces files but does not restart anything already running - restart the service whose script changed, e.g. \`/etc/init.d/sim-hotplug restart\`."
              echo "> `base-files` is version-pinned in `/etc/apk/world` by the image build, so `apk upgrade base-files` prints OK and changes nothing. Use `apk add base-files=<version>`."
            else
              echo "> \`PKG_RELEASE\` was bumped for this build only - commit packages/${PKG}/Makefile."
            fi
          } >> $GITHUB_STEP_SUMMARY
