name: OpenWrt Builder

# Manual per-board build.  "all" builds every diffconfigs/* entry; picking a
# single device builds just that one.  Both paths go through ./build.sh, which
# owns the OpenWrt checkout, the BSP sync and the docker toolchain - this
# workflow must not reimplement any of that (it used to, against a tree layout
# that no longer exists).

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (all = build all devices)'
        required: false
        type: choice
        default: all
        # GitHub choice inputs are a static list - keep in sync with diffconfigs/.
        options:
          - all
          - hmuf02v5
          - mf800b
          - mifib-v12
          - uf02
          - ufi001b
          - ufi003
          - uz801

env:
  UPLOAD_FIRMWARE: true
  TZ: Europe/Madrid

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.device == 'all' || inputs.device == '') && '["hmuf02v5","mf800b","mifib-v12","uf02","ufi001b","ufi003","uz801"]' || format('["{0}"]', inputs.device)) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space on runner
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo apt-get clean

    - name: Determine version
      id: vars
      run: |
        VERSION="$(cat version 2>/dev/null || echo 25.12.6)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

    - name: Cache OpenWrt downloads & toolchain
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
          openwrt/staging_dir/host
        key: openwrt-cache-${{ steps.vars.outputs.version }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}-${{ github.run_id }}
        restore-keys: |
          openwrt-cache-${{ steps.vars.outputs.version }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}-
          openwrt-cache-${{ steps.vars.outputs.version }}-
          openwrt-cache-

    - name: Build docker builder image & prepare OpenWrt tree
      env:
        APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
      run: |
        ./build.sh prepare
        if [ -z "$APK_SIGNING_KEY" ]; then
          echo "::error::APK_SIGNING_KEY secret is not set."
          echo "::error::Without it the feed would be signed with a random, per-build key"
          echo "::error::and every device would reject it with 'UNTRUSTED signature'."
          exit 1
        fi
        printf '%s\n' "$APK_SIGNING_KEY" > openwrt/private-key.pem

    - name: Compile the firmware
      run: |
        ./build.sh build ${{ matrix.device }}

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/msm89xx/msm8916
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ matrix.device }}_${{ steps.vars.outputs.version }}_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-gpt_both0.bin
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-boot.img
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-system.img
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-sysupgrade.bin
          ${{ env.FIRMWARE }}/*-msm89xx-*.manifest
          ${{ env.FIRMWARE }}/*-msm89xx-*-flash.sh
          ${{ env.FIRMWARE }}/*-msm89xx-*-firmware.zip
