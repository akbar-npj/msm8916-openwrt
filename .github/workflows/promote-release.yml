name: Promote Release to Production

# A release built by build-and-release.yml is a TEST build: the GitHub release
# is a prerelease, gh-pages gets only releases/<version>, and the shared
# releases/<base> feed and the root firmware.json are left alone.  Nothing a
# running device polls can see it.
#
# This is the second half.  Once the test build has passed on hardware, this
# workflow copies its feed into releases/<base>, publishes the root manifest
# that devices ask for first, prunes kernel/kmod generations, and flips the
# GitHub release to "latest".  It rebuilds nothing: everything it needs was
# already published by the test build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote, e.g. v25.12.6-r7 (must exist as a prerelease)"
        required: true
      dry_run:
        description: "Do everything except the gh-pages push and the release edit."
        required: false
        type: boolean
        default: false
      feed_only:
        description: "Feed maintenance on an already-promoted tag: re-copy, prune and re-index releases/<base> but leave the GitHub release alone."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Same group as the release build: promotion rewrites the shared feed, so it
# must never overlap a build that is deploying to the same branch.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to production
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Resolve and verify the test release
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          FEED_ONLY: ${{ inputs.feed_only }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag must look like v25.12.6-r7, got '$TAG'"; exit 1 ;;
          esac

          gh release view "$TAG" --json isPrerelease,isDraft,assets > /tmp/rel.json
          pre=$(jq -r .isPrerelease /tmp/rel.json)
          draft=$(jq -r .isDraft /tmp/rel.json)
          n=$(jq -r '.assets | length' /tmp/rel.json)

          [ "$draft" = "false" ] || { echo "::error::$TAG is a draft"; exit 1; }
          if [ "$pre" != "true" ] && [ "${FEED_ONLY:-}" != "true" ]; then
            echo "::error::$TAG is already a production release - nothing to promote."
            exit 1
          fi
          if [ "$pre" != "true" ]; then
            echo "::notice::feed_only on an already-promoted tag: touching the feed, not the release."
          fi
          if [ "$n" -lt 8 ]; then
            echo "::error::$TAG has only $n assets; that is not a complete board matrix."
            exit 1
          fi

          VERSION="${TAG#v}"
          BASE="${VERSION%-r*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Promoting $TAG -> version $VERSION, feed base $BASE, $n assets."

      - name: Publish the feed and the root manifest on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          BASE: ${{ steps.vars.outputs.base }}
          DRY_RUN: ${{ inputs.dry_run }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          rm -rf /tmp/promo
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/promo
          cd /tmp/promo

          SRC="releases/${VERSION}"
          DST="releases/${BASE}"
          if [ ! -d "$SRC" ]; then
            echo "::error::no $SRC on gh-pages - the test build never published its feed."
            exit 1
          fi

          mkdir -p "$DST/targets/msm89xx/msm8916" "$DST/packages"
          cp -a "$SRC/targets/msm89xx/msm8916/packages/." "$DST/targets/msm89xx/msm8916/packages/"
          cp -a "$SRC/packages/aarch64_generic/." "$DST/packages/aarch64_generic/"
          cp -f "$SRC/targets/msm89xx/msm8916/firmware.json" firmware.json
          [ -f "$SRC/public-key.pem" ] && cp -f "$SRC/public-key.pem" "$DST/public-key.pem" || true

          # Kernel and kmods are per-vermagic: keep exactly the set this release
          # built and drop older generations.  The feed directory is additive and
          # `apk list -a` prints in index order rather than version order, so a
          # leftover generation is what makes a device believe its own kernel is
          # missing from the feed.
          BUILT="$SRC/targets/msm89xx/msm8916/packages"
          for f in "$DST"/targets/msm89xx/msm8916/packages/kernel-*.apk \
                   "$DST"/targets/msm89xx/msm8916/packages/kmod-*.apk; do
            [ -e "$f" ] || continue
            [ -e "$BUILT/$(basename "$f")" ] && continue
            echo "prune ${f#releases/}"
            git rm -q "$f"
          done

          # base-files is the image identity: package/Makefile installs it as
          # "base-files=<version>" (with libc and kernel), so /etc/apk/world
          # carries an exact pin.  apk honours that pin, which means
          # `apk upgrade base-files` -- exactly what LuCI's Software page runs --
          # prints OK and changes nothing (measured 2026-11-04 on an r5 unit:
          # world pinned 1718, the shared feed offered the r7 image's 1721,
          # exit code 0, installed version unchanged).  Publishing a newer
          # image's base-files here therefore shows every older revision an
          # update that cannot be applied.  A base-files fix is a hotfix: it is
          # revision-scoped and carries its own --repository, so the shared feed
          # never needs one.
          TP="$DST/targets/msm89xx/msm8916/packages"
          DROPPED=0
          # The copy above just brought this release's base-files into the
          # directory, so the file is usually UNTRACKED: an earlier promotion
          # already dropped that exact name (base-files' PKG_RELEASE counts
          # upstream commits, so it does not move between our revisions).
          # `git rm` aborts on an untracked path ("did not match any files")
          # and fails the whole promotion, so delete from the worktree and let
          # the `git add -A` below stage the deletion when it was tracked.
          for f in "$TP"/base-files-*.apk; do
            [ -e "$f" ] || continue
            echo "drop ${f#releases/}"
            rm -f "$f"
            DROPPED=1
          done

          # packages.adb is a signed binary index: a stale entry would make apk
          # fetch a file that is no longer there, so it is rebuilt from the
          # files that remain.  alpine:3.23 carries apk-tools 3.0.x, the same
          # major as the image; an index it writes reads back under the tree's
          # 3.0.5 (verified).  index.json is the same data in the version-2 json
          # form that openwrt/scripts/make-index-json.py emits.
          if [ "$DROPPED" = 1 ]; then
            KEY="$(mktemp)"
            chmod 600 "$KEY"
            printf '%s\n' "$APK_SIGNING_KEY" > "$KEY"
            docker run --rm -v "$PWD/$TP:/feed" -v "$KEY:/key.pem:ro" -w /feed \
              alpine:3.23 sh -c '
                apk mkndx --root /feed --keys-dir /feed --allow-untrusted \
                  --sign /key.pem --output packages.adb *.apk >/dev/null
                apk adbdump --format json packages.adb
              ' > /tmp/targets-adbdump.json
            rm -f "$KEY"
            jq 'def strip($n; $abi):
                  if ($abi|length) > 0 and ($n|endswith($abi))
                  then $n[0:(($n|length) - ($abi|length))] else $n end;
                {version: 2, architecture: "aarch64_generic",
                 packages: (.packages | map(
                   . as $p
                   | ([ $p.tags[]? | select(startswith("openwrt:abiversion=")) | .[19:] ][0] // "") as $abi
                   | {key: strip($p.name; $abi), value: $p.version}
                 ) | from_entries)}' /tmp/targets-adbdump.json > "$TP/index.json"
            echo "re-indexed $(ls "$TP"/*.apk | wc -l) target packages"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "::warning::gh-pages already matches $VERSION - nothing to change."
            exit 0
          fi

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "::notice::DRY_RUN - not committing. This is what would be published:"
            git diff --cached --stat
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "release: promote ${VERSION} to production (releases/${BASE})"
          for i in 1 2 3; do
            git push -q origin gh-pages && break
            [ "$i" -eq 3 ] && { echo "::error::cannot push the promotion to gh-pages"; exit 1; }
            git pull -q --rebase origin gh-pages
          done
          echo "Promoted $VERSION into $DST and the root firmware.json."

      - name: Flip the GitHub release to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          FEED_ONLY: ${{ inputs.feed_only }}
        run: |
          set -euo pipefail
          if [ "${FEED_ONLY:-}" = "true" ]; then
            echo "::notice::feed_only - the feed is updated, $TAG is left as it is."
            exit 0
          fi
          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "::notice::DRY_RUN - would run: gh release edit $TAG --prerelease=false --latest"
            exit 0
          fi
          gh release edit "$TAG" \
            --prerelease=false \
            --latest \
            --title "OpenWrt ${TAG#v} for Qualcomm MSM8916"
          echo "::notice::$TAG is now the latest production release."
