name: Tests

on:
  # Only the protected branches get a push run.  A feature branch is covered by
  # its pull_request run, and running both made the two events share one
  # concurrency group -- the PR run cancelled the push run, and a cancelled
  # required check blocks the merge even when the surviving run is green.
  push:
    branches: [main, staging-main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Collapses superseded runs of the SAME event, and only those.  Keying on the
# branch alone was not enough: promoting staging-main to main fires a push run
# and a pull_request run for the same commit, they share the group, and the
# second cancels the first -- which leaves a cancelled required check on the
# commit and blocks the merge (PR #31, then #34).  With the event in the key the
# two run side by side and both report.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell test suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # board-profile compares the pull request against its base branch.
          fetch-depth: 0

      # Hardware-free tests: no modem, no root, no OpenWrt. Each suite is a
      # tests/<name>/run.sh that exits non-zero on failure. --self-check also
      # applies mutants and requires each one to be caught.
      - name: himi-ok-guard
        run: bash tests/himi-ok-guard/run.sh --self-check

      - name: board-profile
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--self-check)
          if [ -n "$BASE_REF" ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base-ref "origin/$BASE_REF")
          fi
          bash tests/board-profile/run.sh "${args[@]}"
