name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push to a branch that has an open pull request fires BOTH the push and the
# pull_request event, so every commit used to run the whole suite twice.
# Keying the group on the branch name rather than on the ref collapses the two
# events into one run: whichever starts second cancels the first, and the
# suite still runs for a plain branch push that has no pull request.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell test suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # board-profile compares the pull request against its base branch.
          fetch-depth: 0

      # Hardware-free tests: no modem, no root, no OpenWrt. Each suite is a
      # tests/<name>/run.sh that exits non-zero on failure. --self-check also
      # applies mutants and requires each one to be caught.
      - name: himi-ok-guard
        run: bash tests/himi-ok-guard/run.sh --self-check

      - name: board-profile
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--self-check)
          if [ -n "$BASE_REF" ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base-ref "origin/$BASE_REF")
          fi
          bash tests/board-profile/run.sh "${args[@]}"
