name: Tests

on:
  # Only the protected branches get a push run.  A feature branch is covered by
  # its pull_request run, and running both made the two events share one
  # concurrency group -- the PR run cancelled the push run, and a cancelled
  # required check blocks the merge even when the surviving run is green.
  push:
    branches: [main, staging-main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Collapses superseded runs of the SAME event, and only those.  Keying on the
# branch alone was not enough: promoting staging-main to main fires a push run
# and a pull_request run for the same commit, they share the group, and the
# second cancels the first -- which leaves a cancelled required check on the
# commit and blocks the merge (PR #31, then #34).  With the event in the key the
# two run side by side and both report.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell test suites
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # board-profile compares the pull request against its base branch.
          fetch-depth: 0

      # A pull request into main may not come from a private branch.  GitHub
      # has no rule for "which branch may open a pull request", so this is a
      # step; the publish-private label is how permission is granted.
      - name: private branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: bash scripts/branch-guard.sh "$HEAD_REF" "$BASE_REF" "$PR_LABELS"

      # Hardware-free tests: no modem, no root, no OpenWrt. Each suite is a
      # tests/<name>/run.sh that exits non-zero on failure. --self-check also
      # applies mutants and requires each one to be caught.
      - name: himi-ok-guard
        run: bash tests/himi-ok-guard/run.sh --self-check

      - name: led-role
        run: bash tests/led-role/run.sh --self-check

      - name: modem-watchdog
        run: bash tests/modem-watchdog/run.sh --self-check

      - name: apk-overlay-heal
        run: bash tests/apk-overlay-heal/run.sh --self-check

      - name: time-sync
        run: bash tests/time-sync/run.sh --self-check

      - name: tailscale-migration
        run: bash tests/tailscale-migration/run.sh --self-check

      - name: led-templates
        run: bash tests/led-templates/run.sh --self-check

      - name: usb-gadget-net
        run: bash tests/usb-gadget-net/run.sh --self-check

      - name: usb-gadget-probe
        run: bash tests/usb-gadget-probe/run.sh --self-check

      - name: hotfix-scope
        run: bash tests/hotfix-scope/run.sh --self-check

      - name: apk-flag-guard
        run: bash tests/apk-flag-guard/run.sh --self-check

      - name: private-guard
        run: bash tests/private-guard/run.sh --self-check

      # The board scaffolder needs dtc and fdtget, which the runner does not
      # ship.  It reads a vendor DTB and writes five files at once, so a silent
      # mistake there produces a board that builds and does not boot.
      - name: new-board-tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler
          bash tests/new-board-tool/run.sh --self-check

      - name: board-profile
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--self-check)
          if [ -n "$BASE_REF" ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base-ref "origin/$BASE_REF")
          fi
          bash tests/board-profile/run.sh "${args[@]}"
