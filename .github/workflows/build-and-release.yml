name: Build OpenWrt MSM8916 & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v25.12.6, leave empty to use current version)"
        required: false
        default: ""
      boards:
        description: "Targeted release: space-separated board ids to build (empty = all). Boards not built keep their previous manifest entry."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build All Boards, Kmods & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo apt-get clean

      - name: Determine Release Tag & Version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # No tag given and not a tag push: derive it from the version file,
            # so a manual dispatch cannot publish "v25.12.6" for an r1 build.
            TAG="v$(cat version 2>/dev/null || echo 25.12.6)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          VERSION=$(cat version 2>/dev/null || echo "25.12.6")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Devices point CONFIG_VERSION_REPO at releases/<base>, where base is
          # the version WITHOUT the -rN suffix (see sync-version.sh).  Publish
          # the feed there as well, or every device gets a 404.
          BASE="${VERSION%-r*}"
          echo "base=${BASE}" >> $GITHUB_OUTPUT
          echo "Building for Tag: ${TAG}, OpenWrt Version: ${VERSION}, Feed base: ${BASE}"

      - name: Cache OpenWrt Downloads & Toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
            openwrt/staging_dir/host
          key: openwrt-cache-${{ steps.vars.outputs.version }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}-${{ github.run_id }}
          restore-keys: |
            openwrt-cache-${{ steps.vars.outputs.version }}-${{ hashFiles('openwrt/feeds.conf.default', 'diffconfigs/hmuf02v5') }}-
            openwrt-cache-${{ steps.vars.outputs.version }}-
            openwrt-cache-

      - name: Build Docker Builder Image & Prepare OpenWrt Tree
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          ./build.sh prepare
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "::error::APK_SIGNING_KEY secret is not set."
            echo "::error::Without it the feed would be signed with a random, per-build key"
            echo "::error::and every device would reject it with 'UNTRUSTED signature'."
            echo "::error::Set the secret to the persistent EC P-256 private key and retry."
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_KEY" > openwrt/private-key.pem
          echo "Injected persistent private signing key."

      - name: Compile Firmware Images
        env:
          # Empty = every board.  A non-empty list is a targeted fix release:
          # only those boards are rebuilt, and the manifest merge keeps the
          # other boards on their last published version.
          BOARDS: ${{ github.event.inputs.boards }}
        run: |
          set -euo pipefail
          if [ -z "${BOARDS// /}" ]; then
            echo "Building all boards."
            ./build.sh build all
          else
            echo "Building boards: $BOARDS"
            ./build.sh build $BOARDS
          fi

      - name: Compile Extra Packages (CUPS Print Server & Drivers)
        run: |
          docker compose -f devenv/docker-compose.yml exec -T builder bash -c "
            umask 022
            cd /repo/openwrt
            make package/msm8916/cups/compile package/index V=s
          "

      - name: Package Offline Kmod Bundle & Compute Checksums
        run: |
          cd openwrt/bin/targets/msm89xx/msm8916
          tar -czvf kmods-msm8916-${{ steps.vars.outputs.version }}.tar.gz packages/
          sha256sum *-msm89xx-msm8916-*-squashfs-boot.img \
                    *-msm89xx-msm8916-*-squashfs-system.img \
                    *-msm89xx-msm8916-*-squashfs-sysupgrade.bin \
                    *-msm89xx-msm8916-*-squashfs-gpt_both0.bin \
                    *-msm89xx-msm8916-*-flash.sh \
                    *-msm89xx-msm8916-*-firmware.zip \
                    kmods-msm8916-${{ steps.vars.outputs.version }}.tar.gz > sha256sums
          cat sha256sums

      - name: Generate firmware.json Manifest
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          BASE: ${{ steps.vars.outputs.base }}
          PAGES_BASE: https://akbar-npj.github.io/msm8916-openwrt
          # Deliberate floor for automatic upgrades, NOT "${BASE}-r1": a per-base
          # floor would make every cross-version jump (25.12.6 -> 25.12.7)
          # un-flashable, and do_upgrade would refuse it after the UI offered it.
          # Bump this only when a release is genuinely not flashable from older
          # builds (config/partition layout change).
          MIN_VERSION: "25.12.6-r1"
        run: |
          set -euo pipefail
          BIN=openwrt/bin/targets/msm89xx/msm8916
          PREV=/tmp/prev-firmware.json
          rm -f "$PREV"
          # The published manifest is shared by all boards.  Pull the current one
          # in so boards that this run did NOT rebuild keep their entry: a
          # targeted single-board fix release must not erase the other six.
          if curl -fsS --max-time 30 "$PAGES_BASE/firmware.json" -o "$PREV"; then
            echo "Merging into the published manifest:"
            python3 -c 'import json,sys; d=json.load(open("/tmp/prev-firmware.json")); print("  release", d.get("release"), "-", len(d.get("boards",{})), "board keys")'
          else
            echo "No published manifest yet; generating a fresh one."
            rm -f "$PREV"
          fi
          MERGE=""
          if [ -f "$PREV" ]; then MERGE="--merge $PREV"; fi
          python3 scripts/gen-firmware-manifest.py \
            --mk msm89xx/image/msm8916.mk \
            --bin-dir "$BIN" \
            --version "$VERSION" \
            --pages-base "$PAGES_BASE" \
            --release-base "https://github.com/akbar-npj/msm8916-openwrt/releases/download/${{ steps.vars.outputs.tag }}" \
            --out "$BIN/firmware.json" \
            --min-version "$MIN_VERSION" \
            $MERGE \
            --notes "OpenWrt ${VERSION} for MSM8916"
          echo "Generated $BIN/firmware.json"

      - name: Prepare GitHub Pages Feed Repository
        run: |
          set -euo pipefail
          # Two paths, on purpose:
          #   releases/<base>     what devices actually read.  CONFIG_VERSION_REPO
          #                       is written by sync-version.sh as releases/<base>,
          #                       i.e. WITHOUT the -rN suffix, so a rebuild of the
          #                       same OpenWrt version keeps a working feed.
          #   releases/<version>  the exact release, so a specific build stays
          #                       identifiable and reproducible.
          # Publishing only the second one leaves every device with a 404 feed.
          for DIR in $(printf '%s\n' "${{ steps.vars.outputs.base }}" "${{ steps.vars.outputs.version }}" | sort -u); do
            echo "Publishing feed to releases/${DIR}"
            mkdir -p "/tmp/gh-pages-site/releases/${DIR}/targets/msm89xx/msm8916"
            mkdir -p "/tmp/gh-pages-site/releases/${DIR}/packages"
            cp -a openwrt/bin/targets/msm89xx/msm8916/packages "/tmp/gh-pages-site/releases/${DIR}/targets/msm89xx/msm8916/"
            cp -a openwrt/bin/packages/aarch64_generic "/tmp/gh-pages-site/releases/${DIR}/packages/"
            # Firmware upgrade manifest consumed by msm89xx-firmware-upgrade.
            [ -f openwrt/bin/targets/msm89xx/msm8916/firmware.json ] && \
              cp openwrt/bin/targets/msm89xx/msm8916/firmware.json \
                 "/tmp/gh-pages-site/releases/${DIR}/targets/msm89xx/msm8916/firmware.json"
            # Public half of APK_SIGNING_KEY, per release dir.
            [ -f openwrt/public-key.pem ] && cp openwrt/public-key.pem "/tmp/gh-pages-site/releases/${DIR}/public-key.pem" || true
          done
          # Stable, version-independent key path used by apk-key-refresh to
          # self-heal a stale embedded key (see msm89xx/base-files/usr/sbin/apk-key-refresh).
          [ -f openwrt/public-key.pem ] && cp openwrt/public-key.pem /tmp/gh-pages-site/public-key.pem || true
          # Version-independent "latest" manifest.  Devices ask for this first,
          # so a 25.12.6 device still discovers a 25.12.7 release; the per-base
          # copy above stays as the fallback for older firmware.
          cp openwrt/bin/targets/msm89xx/msm8916/firmware.json /tmp/gh-pages-site/firmware.json
          echo "Published root firmware.json (release $(python3 -c 'import json;print(json.load(open("/tmp/gh-pages-site/firmware.json"))["release"])'))"

      - name: Deploy Package Feeds to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/gh-pages-site
          keep_files: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "OpenWrt ${{ steps.vars.outputs.version }} for Qualcomm MSM8916"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-squashfs-boot.img
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-squashfs-system.img
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-squashfs-sysupgrade.bin
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-squashfs-gpt_both0.bin
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-flash.sh
            openwrt/bin/targets/msm89xx/msm8916/*-msm89xx-msm8916-*-firmware.zip
            openwrt/bin/targets/msm89xx/msm8916/kmods-msm8916-${{ steps.vars.outputs.version }}.tar.gz
            openwrt/bin/targets/msm89xx/msm8916/sha256sums
