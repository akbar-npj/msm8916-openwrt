# Make BBR the default TCP congestion control (kmod-sched-bbr).
#
# tcp_bbr is built as a module (CONFIG_TCP_CONG_BBR=m) and shipped by
# kmod-sched-bbr with AutoLoad,30, so kmodloader loads it during preinit --
# before /etc/init.d/sysctl (START=11) applies this file.  The write therefore
# succeeds at boot without an extra init script.
#
# BBR is model-based: it estimates the link's bandwidth and RTT and paces to
# match, instead of filling buffers until loss.  On an LTE bearer that avoids
# the bufferbloat latency spikes the loss-based default (cubic) produces.
#
# The qdisc is left at OpenWrt's default (fq_codel); BBR does its own pacing and
# does not require fq.  Set net.core.default_qdisc=fq here only if you have
# measured a reason to drop CoDel.
net.ipv4.tcp_congestion_control = bbr
