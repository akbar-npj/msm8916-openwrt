# Suppress KERN_INFO (level 6) on every console, keeping it in the ring buffer.
#
# WHY THIS IS IN THE IMAGE AND NOT IN /etc/rc.local
# ------------------------------------------------
# Doc 164 set this at runtime and persisted it in /etc/rc.local.  That file is
# part of the *overlay*, not the image, so the setting was silently lost when
# the device was reflashed -- and nothing noticed, because the symptom is not an
# error but a slower kernel.
#
# MEASURED COST OF LOSING IT (2026-09-23)
# ---------------------------------------
# The console is a 115200-baud serial line costing 1.03 ms + 0.0904 ms/char, so
# an 80-char dev_info is ~8.3 ms.  With console_loglevel = 7 the SSR recovery
# path prints ~33 lines per fatal-triggered restart (23 of them patch 817's
# q6v5-trace dev_info points), which is ~0.24 s of pure console time inside a
# recovery that should take ~0.12 s.  Measured: SSR->MBA booted = 0.333 s at
# level 7, against a recorded 0.119-0.138 s at level 6.
#
# WHY THAT MATTERS FOR STABILITY
# ------------------------------
# Doc 168 measured this directly: the ~8 ms/probe console cost is what moved the
# teardown past the modem power-down (T4 at +52.83 ms vs power-down at
# +44.75 ms), widening an existing race.  Shortening the window is the right
# CONTROL.  It is NOT the cure -- patch 822 (the SMD poll use-after-free) is.
#
# kernel.printk = <console_loglevel> <default_message_loglevel> \
#                 <minimum_console_loglevel> <default_console_loglevel>
#
# Field 4 is set to 6 as well so the value survives a console_loglevel reset.
# dev_err (level 3) still reaches the console, so the kernel keeps a sink;
# KERN_INFO lines remain readable via `dmesg` and /dev/kmsg.
kernel.printk = 6 4 1 6
