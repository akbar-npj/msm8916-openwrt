# Recovery WiFi AP: WPA2 + WPA3 (SAE) with a single shared passphrase.
# ieee80211w=1 (MFP optional) lets old WPA2-PSK clients without PMF join while
# SAE clients still negotiate PMF (mandatory for SAE). wcn36xx needs OpenWrt
# patch 451-wcn36xx-mfp-wpa3 for MFP_CAPABLE.
interface=wlan0
bridge=br0
driver=nl80211
ssid=OpenWrt-Recovery
hw_mode=g
channel=6
# 802.11n + WMM.  Without ieee80211n the AP runs 802.11g only (long preamble,
# no aggregation, ~2 Mbit/s tx on this radio); without WMM hostapd cannot send
# the WMM information element that HT APs are expected to carry, and stations
# then fall back to legacy rates.  The wcn36xx radio advertises HT20/HT40, and
# the AP is pinned to 20 MHz so it stays inside the one channel.
ieee80211n=1
wmm_enabled=1
ht_capab=[HT20][SHORT-GI-20]
wpa=2
wpa_passphrase=recovery
wpa_key_mgmt=WPA-PSK SAE
wpa_pairwise=CCMP
rsn_pairwise=CCMP
ieee80211w=1
