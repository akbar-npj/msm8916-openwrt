# udhcpd server for the recovery USB network (WiFi AP to be added later).
# Serves 192.168.10.2-20 so a connected host gets an address with no manual
# configuration. The recovery box itself is 192.168.10.1/24.
start       192.168.10.2
end         192.168.10.20
interface   usb0
lease_file  /tmp/udhcpd.leases
option      subnet  255.255.255.0
option      router  192.168.10.1
option      dns     192.168.10.1
option      domain  local
