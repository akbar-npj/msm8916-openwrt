# DHCP + DNS for the recovery network.
#
# One server on the br0 bridge that joins the USB NCM link and the WiFi AP, so
# clients on either medium share a single pool (192.168.10.2-20) - the same
# shape as OpenWrt's br-lan + dnsmasq.  The recovery box is 192.168.10.1/24.
#
# dnsmasq is used instead of busybox udhcpd on purpose: udhcpd always
# BROADCASTS its OFFER/ACK, and wcn36xx AP mode does not deliver
# group-addressed frames on an encrypted BSS (measured: 20/20 unicast frames
# arrive at the station, ~10 broadcast OFFERs arrive 0 times).  dnsmasq
# unicasts the reply to the client's MAC, so DHCP works over WPA2/WPA3 as well
# as over USB.
interface=br0
bind-dynamic
dhcp-range=192.168.10.2,192.168.10.20,255.255.255.0,12h
dhcp-option=3,192.168.10.1
dhcp-option=6,192.168.10.1
dhcp-authoritative
dhcp-leasefile=/tmp/dnsmasq.leases
# No upstream network in a rescue environment: serve no names, never block.
no-resolv
no-hosts
log-facility=/tmp/dnsmasq.log
